name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10', '11', '12']
        exclude:
          - php: '8.4'
            laravel: '10'
        include:
          # Every Laravel 10.x and 11.x release is under a security advisory with no fix in that line
          # (fixes ship from 12.60 and in 13.x), so Composer refuses to install them. These jobs
          # check that the package still runs there; they ship nothing, so they lift the block.
          - laravel: '10'
            testbench: '8'
            insecure: true
          - laravel: '11'
            testbench: '9'
            insecure: true
          - laravel: '12'
            testbench: '10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, openssl
          coverage: none
      - if: ${{ matrix.insecure }}
        run: |
          composer config policy.advisories.block false
          composer config audit.block-insecure false
      - run: composer require --no-update "illuminate/support:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      # Only whether the secret exists; the secret itself reaches the scan step alone.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # SonarCloud needs the history for new-code detection
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: intl, openssl
          coverage: pcov
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit --coverage-clover coverage/clover.xml
      - name: SonarQube Scan
        # Skipped until the SONAR_TOKEN secret exists.
        if: ${{ env.HAS_SONAR_TOKEN == 'true' }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
