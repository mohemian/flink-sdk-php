name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs this suite against the tagged commit

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12', '13']
        exclude:
          - php: '8.2' # Laravel 13 needs PHP 8.3
            laravel: '13'
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, openssl
          coverage: none
      - run: composer require --no-update "illuminate/support:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest
      - run: vendor/bin/phpstan analyse --no-progress

  lowest:
    # The `^12.0` floor in composer.json: the lowest versions it allows must pass the suite too.
    name: Lowest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: intl, openssl
          coverage: none
      # Every laravel/framework 12.x below the patched release carries advisories, so composer would
      # refuse the very versions this job exists to run. Dev-only: nothing here ships.
      - run: composer config audit.block-insecure false
      - run: composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest

  format:
    name: Format (Rector + Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4' # the newest Pint needs 8.3+; rector.php still targets 8.2
          extensions: intl, openssl
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      # Fails on any change Rector or Pint would make; run `composer format` to apply them.
      - run: vendor/bin/rector --dry-run --no-progress-bar
      - run: vendor/bin/pint --test

  sonar:
    name: SonarCloud
    # A release tag points at a commit main already analysed; scanning the tag would open a
    # SonarCloud branch named after it.
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    env:
      # Only whether the secret exists; the secret itself reaches the scan step alone.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - name: Require SONAR_TOKEN
        # Fail rather than skip: a skipped scan leaves this job green over code nobody analysed.
        if: ${{ env.HAS_SONAR_TOKEN != 'true' }}
        run: |
          echo "::error title=SONAR_TOKEN missing::SONAR_TOKEN is not available to this repository, so SonarCloud cannot analyse it. An org admin must grant the organisation secret to mohemian/flink-sdk-php."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # SonarCloud needs the history for new-code detection
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: intl, openssl
          coverage: pcov
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pest --coverage-clover coverage/clover.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
